name: Publish Home Assistant image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Read app version
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/^version: "\([^"]*\)"/\1/p' homeassistant/config.yaml)"
          test -n "$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: homeassistant/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/mmaged92/moneynut-amd64:${{ steps.version.outputs.value }}
            ghcr.io/mmaged92/moneynut-amd64:latest
